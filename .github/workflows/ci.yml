name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Conferir que o site da raiz (GitHub Pages) é igual ao do Spring
        run: |
          # js/config.js é a única diferença permitida: na raiz ele aponta para a API publicada
          diff -r src/main/resources/static/css css
          diff -r -x config.js src/main/resources/static/js js
          diff src/main/resources/static/index.html index.html
          diff src/main/resources/static/favicon.svg favicon.svg

      - name: Rodar os testes
        run: |
          chmod +x mvnw
          ./mvnw -B test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t devtasks:ci .
