spring.application.name=Devtasks

# a hospedagem (Render, Railway...) define a porta pela variável PORT; localmente continua 8080
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devtasks}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

jwt.secret=${JWT_SECRET:}

# sites (outras origens) autorizados a chamar a API pelo navegador; separe por vírgula
cors.allowed-origins=${CORS_ORIGINS:https://viniziano.github.io}

# atrás do proxy da hospedagem (Render...), usa os cabeçalhos X-Forwarded-* para saber o endereço público (https)
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# devolve a mensagem dos erros da API (ex.: "E-mail já cadastrado") para o site mostrar ao usuário
server.error.include-message=always
